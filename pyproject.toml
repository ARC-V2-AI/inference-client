[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arc-v2-inference-client"
version = "2.0.0"
description = "Python client and agent SDK for the ARC V2 inference runtime"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "pydantic>=2.7", "pytest>=9.1.1"]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.hatch.build.targets.wheel]
packages = ["src/arc_v2_inference_client", "src/arc_inference"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest-asyncio>=1.4.0"]
